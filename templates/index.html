<!DOCTYPE html>
<html>
<head>
    <title>Arsenal F.C. Stats</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 50px;
            background-color: #f4f4f9;
        }
        h1 {
            color: #e2001a;  /* Arsenal Red */
        }
        .button-container {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 30px;
        }
        .button {
            background-color: #e2001a; /* Arsenal Red */
            color: white;
            padding: 15px 32px;
            text-align: center;
            text-decoration: none;
            display: inline-block;
            font-size: 16px;
            border-radius: 5px;
            cursor: pointer;
            border: none;
            width: 200px;
            margin: 10px 2px;
        }
        .button:hover {
            background-color: #cc0000;
        }
        .title-container {
            margin-bottom: 40px;
        }
    </style>
</head>
<body>
    <div class="title-container">
        <h1>Welcome to Arsenal F.C. Stats</h1>
        <p>Choose an option below to view more details about Arsenal F.C.!</p>
    </div>

    <div class="button-container">
        <a href="/team" class="button">Team Info</a>
        <a href="/fixtures" class="button">Upcoming Fixtures</a>
        <a href="/standings" class="button">League Standings</a>
        <a href="/livescores" class="button">Live Scores</a>
    </div>
</body>
</html>
